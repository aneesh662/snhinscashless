<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="login"><div class="login-card"><div class="brand"><div class="brand-mark">SNH</div><div><h1>Admin Portal</h1><p>Cashless Insurance Management</p></div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" style="margin-top:20px"><label>Username</label><input name="username" required><label>Password</label><input name="password" type="password" required><button class="btn btn-primary" style="width:100%;margin-top:8px">Login</button></form><p style="font-size:11px;color:#64748b;margin-top:15px">Change the default admin credentials before production.</p></div></div></body></html>
